# Render Blueprint Specification for Real Estate App
version: "1"

services:
  # Backend Web Service (Django + Gunicorn)
  - type: web
    name: realestate-backend
    runtime: python
    rootDir: backend
    buildCommand: "uv sync --frozen && uv run python backend/manage.py migrate --noinput && uv run python backend/manage.py collectstatic --noinput"
    startCommand: "uv run gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    plan: free
    healthCheckPath: /api/accounts/profile/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: realestate-db
    plan: free
    databaseName: realestate
    user: realestate_user
